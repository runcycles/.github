name: Reusable TypeScript CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node.js versions to test'
        type: string
        default: '[20, 22]'
      run-lint:
        description: 'Whether to run npm run lint'
        type: boolean
        default: true
      run-build:
        description: 'Whether to run npm run build'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ fromJson(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Build
        if: ${{ inputs.run-build }}
        run: npm run build

      - run: npm run test:coverage

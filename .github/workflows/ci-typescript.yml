name: Reusable TypeScript CI

on:
  workflow_call:
    inputs:
      node-versions:
        description: 'JSON array of Node.js versions to test'
        type: string
        default: '[20, 22]'
      run-lint:
        description: 'Whether to run npm run lint'
        type: boolean
        default: true
      run-build:
        description: 'Whether to run npm run build'
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ${{ fromJson(inputs.node-versions) }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci

      - run: npm run typecheck

      - name: Lint
        if: ${{ inputs.run-lint }}
        run: npm run lint

      - name: Build
        if: ${{ inputs.run-build }}
        run: npm run build

      - run: npm run test:coverage
